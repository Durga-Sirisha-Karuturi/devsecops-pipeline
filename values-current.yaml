controller:
  serviceType: NodePort
  nodePort: 31180       # access Jenkins at http://<node-ip>:32000

agent:
  enabled: true

  # Mount the host Docker socket into every agent pod
  volumes:
    - type: HostPath
      hostPath: /var/run/docker.sock
      mountPath: /var/run/docker.sock

  # Give agent permission to use the socket
  # docker group id on Ubuntu is usually 999 — verify with: stat -c '%g' /var/run/docker.sock
  runAsGroup: 999
  privileged: false       # no need for privileged — socket mount is enough


  # Install docker CLI inside the agent container
  # The socket is the daemon — agent just needs the CLI to talk to it
  containerCap: 10

