controller:
  serviceType: NodePort
  nodePort: 31180

  # No plugins downloaded at init — install via UI after Jenkins starts

  javaOpts: "-Djenkins.install.runSetupWizard=false"

  # No Docker socket needed on the controller anymore
  # Each pipeline stage runs in its own purpose-built container


agent:
  enabled: true

  # No Docker socket mount needed — Kaniko handles builds
  # Trivy pulls from Harbor registry directly
  # All tools run as native binaries in their own containers

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "4Gi"
